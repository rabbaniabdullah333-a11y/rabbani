<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | .RABBANI. Professional Football Training</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!-- Dynamic Background -->
    <img src="login_bg_football_1778051548108.png" alt="Stadium" class="bg-image">

    <div class="login-container">
        <div class="login-card" id="loginCard">
            <!-- Logo Section -->
            <div class="logo-section">
                <a href="index.html">
                    <img src="Untitled design (2).png" alt=".RABBANI.">
                </a>
            </div>

            <!-- Login Header -->
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Enter your details to access your training dashboard</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope"></i>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">
                    <span>Sign In</span>
                </button>

                <div class="divider">
                    <span>Or continue with</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn-social">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
                            alt="Google">
                        Google
                    </button>
                    <button type="button" class="btn-social">
                        <i class="fab fa-apple" style="font-size: 1.2rem;"></i>
                        Apple
                    </button>
                </div>

                <div class="signup-link">
                    Don't have an account? <a href="register.html">Create account</a>
                </div>
            </form>

            <!-- Success State (Hidden) -->
            <div class="success-check" id="successState">
                <div class="checkmark-circle">
                    <div class="background"></div>
                    <div class="check"></div>
                </div>
                <h2 style="color: white; margin-bottom: 10px;">Login Successful!</h2>
                <p style="color: #94a3b8;">Redirecting to your dashboard...</p>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const form = document.getElementById('loginForm');
            const success = document.getElementById('successState');
            const header = document.querySelector('.login-header');
            const email = document.getElementById('email').value;

            // Simulate loading
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.style.opacity = '0.7';
            btn.disabled = true;

            setTimeout(() => {
                // Save login status
                localStorage.setItem('rabbani_logged_in', 'true');
                localStorage.setItem('rabbani_user_email', email);

                // Transition to success state
                form.style.display = 'none';
                header.style.display = 'none';
                success.style.display = 'flex';

                // Redirect after animation
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }, 1500);
        }
    </script>
</body>

</html>
