<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | .RABBANI. Professional Football Training</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS (Reusing login.css) -->
    <link rel="stylesheet" href="login.css">
    <style>
        .login-card {
            max-width: 500px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Dynamic Background -->
    <img src="login_bg_football_1778051548108.png" alt="Stadium" class="bg-image">

    <div class="login-container">
        <div class="login-card" id="registerCard">
            <!-- Logo Section -->
            <div class="logo-section">
                <a href="index.html">
                    <img src="Untitled design (2).png" alt=".RABBANI.">
                </a>
            </div>

            <!-- Header -->
            <div class="login-header">
                <h1>Join the Elite</h1>
                <p>Start your professional training journey today</p>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="firstname">First Name</label>
                        <div class="input-wrapper" style="padding-left: 0;">
                             <i class="far fa-user" style="left: 16px;"></i>
                            <input type="text" id="firstname" placeholder="John" required style="padding-left: 48px;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastname">Last Name</label>
                        <div class="input-wrapper" style="padding-left: 0;">
                             <i class="far fa-user" style="left: 16px;"></i>
                            <input type="text" id="lastname" placeholder="Doe" required style="padding-left: 48px;">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope"></i>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" required>
                        I agree to the <a href="#" style="color: var(--primary-color); text-decoration: none;">Terms & Conditions</a>
                    </label>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">
                    <span>Create Account</span>
                </button>

                <div class="divider">
                    <span>Or sign up with</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn-social">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
                            alt="Google">
                        Google
                    </button>
                    <button type="button" class="btn-social">
                        <i class="fab fa-apple" style="font-size: 1.2rem;"></i>
                        Apple
                    </button>
                </div>

                <div class="signup-link">
                    Already have an account? <a href="login.html">Sign In</a>
                </div>
            </form>

            <!-- Success State (Hidden) -->
            <div class="success-check" id="successState">
                <div class="checkmark-circle">
                    <div class="background"></div>
                    <div class="check"></div>
                </div>
                <h2 style="color: white; margin-bottom: 10px;">Account Created!</h2>
                <p style="color: #94a3b8;">Welcome to the team. Redirecting to login...</p>
            </div>
        </div>
    </div>

    <script>
        function handleRegister(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const form = document.getElementById('registerForm');
            const success = document.getElementById('successState');
            const header = document.querySelector('.login-header');

            // Simulate loading
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.style.opacity = '0.7';
            btn.disabled = true;

            setTimeout(() => {
                // Transition to success state
                form.style.display = 'none';
                header.style.display = 'none';
                success.style.display = 'flex';

                // Redirect after animation
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }, 1500);
        }
    </script>
</body>

</html>
